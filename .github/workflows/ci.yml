name: CI

on:
  push:
    branches:
      - ci/validate-python315-20261015

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust
      - run: cargo fmt -- --check
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  linux:
    needs: [rust]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: auto
          - runner: ubuntu-22.04
            target: x86
            manylinux: auto
          - runner: ubuntu-22.04-arm
            target: aarch64
            manylinux: auto
          - runner: ubuntu-22.04
            target: armv7
            manylinux: auto
          - runner: ubuntu-22.04
            target: s390x
            manylinux: auto
          - runner: ubuntu-22.04
            target: ppc64le
            manylinux: 2_28
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.13
            3.x
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i python3.13 --manifest-path crates/primp-python/Cargo.toml
          manylinux: ${{ matrix.platform.manylinux }}
      # Regular abi3 and free-threaded wheels require separate maturin invocations.
      - name: Build free-threaded wheels (3.14t and abi3t >= 3.15)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i python3.14t python3.15t --manifest-path crates/primp-python/Cargo.toml
          manylinux: ${{ matrix.platform.manylinux }}
      - name: Check retained and new wheel ABI tags
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          wheels = [path.name for path in Path("dist").glob("*.whl")]
          print("\n".join(wheels))
          tags = [wheel.rsplit("-", 3)[-3:-1] for wheel in wheels]
          for python_tag, abi_tag in (("cp310", "abi3"), ("cp314", "cp314t"), ("cp315", "abi3t")):
              assert any(python_tag in py.split(".") and abi_tag in abi.split(".") for py, abi in tags), (python_tag, abi_tag)
          PYTHON
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        working-directory: crates/primp-python
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install primp --no-index --find-links ../../dist --force-reinstall
          pip install pytest pytest-asyncio certifi
          pytest
      - name: pytest (aarch64)
        if: ${{ matrix.platform.target == 'aarch64' }}
        shell: bash
        working-directory: crates/primp-python
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install primp --no-index --find-links ../../dist --force-reinstall
          pip install pytest pytest-asyncio certifi
          pytest
      - name: pytest (emulated)
        if: ${{ !startsWith(matrix.platform.target, 'x86') && matrix.platform.target != 'aarch64' && matrix.platform.target != 'ppc64' }}
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.platform.target }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip
            pip3 install -U pip pytest pytest-asyncio certifi
          run: |
            set -e
            pip3 install primp --no-index --find-links dist --force-reinstall
            cd crates/primp-python && pytest

  musllinux:
    needs: [rust]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.13
            3.x
      - uses: Swatinem/rust-cache@v2
        with:
          key: musllinux-${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i python3.13 --manifest-path crates/primp-python/Cargo.toml
          manylinux: musllinux_1_2
      # Regular abi3 and free-threaded wheels require separate maturin invocations.
      - name: Build free-threaded wheels (3.14t and abi3t >= 3.15)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i python3.14t python3.15t --manifest-path crates/primp-python/Cargo.toml
          manylinux: musllinux_1_2
      - name: Check retained and new wheel ABI tags
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          wheels = [path.name for path in Path("dist").glob("*.whl")]
          print("\n".join(wheels))
          tags = [wheel.rsplit("-", 3)[-3:-1] for wheel in wheels]
          for python_tag, abi_tag in (("cp310", "abi3"), ("cp314", "cp314t"), ("cp315", "abi3t")):
              assert any(python_tag in py.split(".") and abi_tag in abi.split(".") for py, abi in tags), (python_tag, abi_tag)
          PYTHON
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        run: |
          docker run --rm -v ${{ github.workspace }}:/io -w /io alpine:latest sh -c "
            set -e
            apk add py3-pip py3-virtualenv
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install primp --no-index --find-links dist --force-reinstall
            pip install pytest pytest-asyncio certifi
            cd crates/primp-python && pytest
          "
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') }}
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.platform.target }}
          distro: alpine_latest
          githubToken: ${{ github.token }}
          install: |
            apk add py3-virtualenv
          run: |
            set -e
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install pytest pytest-asyncio certifi
            pip install primp --no-index --find-links dist --force-reinstall
            cd crates/primp-python && pytest

  windows:
    needs: [rust]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
          architecture: ${{ matrix.platform.python_arch }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i python3.13 --manifest-path crates/primp-python/Cargo.toml
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14t
          architecture: ${{ matrix.platform.python_arch }}
      - uses: actions/setup-python@v6
        with:
          python-version: 3.15t
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build free-threaded wheels (3.14t and abi3t >= 3.15)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i python3.14t python3.15t --manifest-path crates/primp-python/Cargo.toml
      - name: Check retained and new wheel ABI tags
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          wheels = [path.name for path in Path("dist").glob("*.whl")]
          print("\n".join(wheels))
          tags = [wheel.rsplit("-", 3)[-3:-1] for wheel in wheels]
          for python_tag, abi_tag in (("cp310", "abi3"), ("cp314", "cp314t"), ("cp315", "abi3t")):
              assert any(python_tag in py.split(".") and abi_tag in abi.split(".") for py, abi in tags), (python_tag, abi_tag)
          PYTHON
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        shell: bash
        working-directory: crates/primp-python
        run: |
          set -e
          python3 -m venv .venv
          source .venv/Scripts/activate
          pip install primp --no-index --find-links ../../dist --force-reinstall
          pip install pytest pytest-asyncio certifi
          pytest

  macos:
    needs: [rust]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.13
            3.14t
            3.15t
            3.x
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i python3.13 --manifest-path crates/primp-python/Cargo.toml
      # Regular abi3 and free-threaded wheels require separate maturin invocations.
      - name: Build free-threaded wheels (3.14t and abi3t >= 3.15)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: 1.14.1
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i python3.14t python3.15t --manifest-path crates/primp-python/Cargo.toml
      - name: Check retained and new wheel ABI tags
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          wheels = [path.name for path in Path("dist").glob("*.whl")]
          print("\n".join(wheels))
          tags = [wheel.rsplit("-", 3)[-3:-1] for wheel in wheels]
          for python_tag, abi_tag in (("cp310", "abi3"), ("cp314", "cp314t"), ("cp315", "abi3t")):
              assert any(python_tag in py.split(".") and abi_tag in abi.split(".") for py, abi in tags), (python_tag, abi_tag)
          PYTHON
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        working-directory: crates/primp-python
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install primp --no-index --find-links ../../dist --force-reinstall
          pip install pytest pytest-asyncio certifi
          pytest

  sdist:
    needs: [rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdist
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: 1.14.1
          command: sdist
          args: --out dist --manifest-path crates/primp-python/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  wheel-tests:
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14t', '3.15t', '3.15']
        platform:
          - runner: ubuntu-22.04
            artifact: wheels-linux-x86_64
            architecture: x64
          - runner: ubuntu-22.04-arm
            artifact: wheels-linux-aarch64
            architecture: arm64
          - runner: windows-latest
            artifact: wheels-windows-x64
            architecture: x64
          - runner: windows-latest
            artifact: wheels-windows-x86
            architecture: x86
          - runner: windows-11-arm
            artifact: wheels-windows-aarch64
            architecture: arm64
          - runner: macos-15-intel
            artifact: wheels-macos-x86_64
            architecture: x64
          - runner: macos-latest
            artifact: wheels-macos-aarch64
            architecture: arm64
        include:
          - python: '3.10'
            platform:
              runner: ubuntu-22.04
              artifact: wheels-linux-x86_64
              architecture: x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.architecture }}
      - uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist
      - name: Test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links dist primp
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 certifi==2026.7.22
          cp -R crates/primp-python/tests "$RUNNER_TEMP/primp-tests"
          cp crates/primp-python/pyproject.toml "$RUNNER_TEMP/pyproject.toml"
          cd "$RUNNER_TEMP"
          mv primp-tests tests
          python - <<'PYTHON'
          import sys
          import sysconfig
          import primp
          print(primp.__file__)
          if "${{ matrix.python }}".endswith("t"):
              assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
              assert not sys._is_gil_enabled()
          PYTHON
          python -m pytest tests

  benchmark:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [linux]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          name: wheels-linux-x86_64
      - name: Install dependencies
        run: |
          pip install -r crates/primp-python/benchmark/requirements.txt
          pip install primp --no-index --find-links ./ --force-reinstall
      - name: Start granian server
        working-directory: crates/primp-python/benchmark
        run: |
          python -m granian server:app --host 0.0.0.0 --port 8000 --interface asgi &
          sleep 5
      - name: Run benchmark
        working-directory: crates/primp-python/benchmark
        run: python benchmark.py
